[package]
name = "magicpay"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Official Rust SDK for the MagicPay payment API"
license = "MIT"
homepage = "https://magicpay.ai"
documentation = "https://magicpay.gitbook.io/magicpay-documentation"
keywords = ["magicpay", "payment", "payments", "3ds", "wallet"]
categories = ["api-bindings", "finance"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
percent-encoding = "2"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }

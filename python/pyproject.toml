[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magicpay"
version = "0.1.0"
description = "Official Python SDK for the MagicPay payment API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MagicPay", email = "ai@magicpay.ai" }]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://magicpay.ai"
Documentation = "https://magicpay.gitbook.io/magicpay-documentation"

[tool.setuptools.packages.find]
include = ["magicpay*"]
